<svg width="680" height="200" viewBox="0 0 340 100" xmlns="http://www.w3.org/2000/svg">

  <!-- Gold gradient background -->
  <defs>
    <linearGradient id="goldBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c8a45c"/>
      <stop offset="100%" stop-color="#a07830"/>
    </linearGradient>
  </defs>

  <rect width="340" height="100" fill="url(#goldBg)"/>

  <!-- KADMIA wordmark -->
  <text x="170" y="62" text-anchor="middle"
    font-family="'Segoe UI',system-ui,sans-serif"
    font-weight="700" font-size="48" letter-spacing="12"
    fill="#1a1a1a">KADMIA<tspan font-size="48" fill="#0d0d0d">.</tspan></text>

  <!-- Subtitle -->
  <text x="170" y="78" text-anchor="middle"
    font-family="'Segoe UI',system-ui,sans-serif"
    font-weight="400" font-size="9" letter-spacing="7"
    fill="#1a1a1a" opacity="0.7">CONSTRUCTIONS</text>

</svg>
